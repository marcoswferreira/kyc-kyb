name: CI Pipeline (.NET 10)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Single Type per File Compliance
        run: |
          python3 -c '
          import os, re, sys
          type_regex = re.compile(r"^\s*(?:public|internal|file)?\s*(?:static|sealed|abstract)?\s*(class|interface|enum|record|struct)\s+([A-Za-z0-9_]+)", re.MULTILINE)
          violations = []
          for root, dirs, files in os.walk("."):
              if any(skip in root for skip in ["bin", "obj", ".git"]):
                  continue
              for f in files:
                  if f.endswith(".cs"):
                      path = os.path.join(root, f)
                      with open(path, "r", encoding="utf-8") as file:
                          content = file.read()
                      matches = type_regex.findall(content)
                      if len(matches) > 1:
                          violations.append((path, [m[1] for m in matches]))
          if violations:
              print(f"❌ Encontradas {len(violations)} violações de Single Type per File:")
              for path, types in violations:
                  print(f"  - {path}: {types}")
              sys.exit(1)
          print("✅ Single Type per File: 100% em conformidade!")
          '

      - name: Restore Dependencies
        run: dotnet restore MiniKycKyb.sln

      - name: Build Solution
        run: dotnet build MiniKycKyb.sln --no-restore --configuration Release

      - name: Run Tests with Code Coverage (>80%)
        run: |
          dotnet test MiniKycKyb.sln \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory ./TestResults

      - name: Verify Minimum 80% Coverage Threshold
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import glob, sys

          coverage_files = glob.glob("./TestResults/**/coverage.cobertura.xml", recursive=True)
          if not coverage_files:
              print("❌ Arquivo coverage.cobertura.xml não encontrado!")
              sys.exit(1)

          total_lines = 0
          covered_lines = 0

          for f in coverage_files:
              tree = ET.parse(f)
              root = tree.getroot()
              total_lines += int(root.attrib.get("lines-valid", 0))
              covered_lines += int(root.attrib.get("lines-covered", 0))

          if total_lines == 0:
              print("❌ Nenhuma linha válida encontrada nos arquivos de cobertura.")
              sys.exit(1)

          coverage_pct = (covered_lines / total_lines) * 100
          print(f"📊 Cobertura Consolidada: {coverage_pct:.2f}% ({covered_lines}/{total_lines} linhas)")

          if coverage_pct < 80.0:
              print(f"❌ Cobertura inferior ao requisito mínimo de 80.0% (Atual: {coverage_pct:.2f}%)")
              sys.exit(1)

          print("✅ Meta de cobertura superada com sucesso (>80%)!")
          '

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: ./TestResults
          retention-days: 14

  docker-build:
    name: Docker Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t mini-kyc-kyb:latest .

      - name: Smoke Test Docker Image
        run: |
          docker run --rm -d --name kyc-smoke-test -p 8080:8080 -e ASPNETCORE_ENVIRONMENT=Development mini-kyc-kyb:latest
          sleep 5
          curl -f http://localhost:8080/api/v1/metering -H "X-Api-Key: sk_live_master_kyc_default_key_12345" || exit 1
          docker stop kyc-smoke-test
